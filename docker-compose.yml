services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kebook-backend
    env_file:
      - .env
    environment:
      # Ensure app uses env-file values; keep explicit for clarity in compose runtime.
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-90}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-KeBook}
      OTP_EXPIRE_SECONDS: ${OTP_EXPIRE_SECONDS:-90}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      MYSQL_SSL_CA: ${MYSQL_SSL_CA:-certs/aiven-ca.pem}
      MYSQL_SSL_VERIFY: ${MYSQL_SSL_VERIFY:-true}
    ports:
      - "8000:8080"
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
